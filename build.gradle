plugins {
    id 'java'
    id 'com.gradleup.shadow' version '8.3.5'
}

group = 'cn.tesseract'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
    gradlePluginPortal()
    maven {
        url = "https://dl.google.com/dl/android/maven2/"
    }
}

dependencies {
    compileOnly project(':asm')
    compileOnly files("libs/android.jar")
    compileOnly files("libs/bak/classes_transformed.jar")
    implementation 'org.mozilla:rhino:1.7.15'
    implementation 'com.google.code.gson:gson:2.11.0'
}

tasks.register('jar2dex', Exec) {
    commandLine 'java', '-cp', 'D:\\build-tools\\34.0.0\\lib\\d8.jar', 'com.android.tools.r8.D8', 'classes.jar', "--min-api", "8"
    workingDir 'libs'
}

tasks.register('buildAPK', Exec) {
    commandLine 'D:\\build-tools\\34.0.0\\aapt.exe', 'a', 'base.apk', 'classes.dex'
    workingDir 'libs'
}

tasks.register('signAPK', Exec) {
    commandLine 'java', '-jar', 'D:\\build-tools\\34.0.0\\lib\\apksigner.jar', 'sign', '--ks', 'union.keystore', '--ks-pass', 'pass:rwunion', '--key-pass', 'pass:rwunion', 'base.apk'
    workingDir 'libs'
}


tasks.register('installAPK', Exec) {
    commandLine 'D:\\platform-tools\\adb.exe', 'install', '-d', 'base.apk'
    workingDir 'libs'
}

tasks.register('run') {
    dependsOn shadowJar
    doLast {
        project(':asm').getTasksByName("transform", false).getAt(0).exec()
        jar2dex.exec()
        buildAPK.exec()
        signAPK.exec()
        installAPK.exec()
    }
}